[project]
name = "langchain-prototyping"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.5.3",
    "langchain>=1.2.15",
    "langchain-openai>=1.2.1",
